name: windows-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      scenario:
        description: '测试场景：full=整场全链路（默认，收口/推送用）；human=修红迭代短场（跳过 32GB 大文件回归与 30 分钟长稳浸泡）；bigfile=只跑大文件回归'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - human
          - bigfile
  schedule:
    - cron: '30 18 * * *'

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 210
    # 修红迭代短场/收口整场制度（2026-11-17 老板令）：push/定时一律整场；
    # 手动派发可选场景——修红迭代期只跑真人模拟省一半场时，全绿收口再跑整场终验
    env:
      SCENARIO: ${{ inputs.scenario || 'full' }}
    steps:
      - name: 场景选择
        shell: pwsh
        run: 'Write-Host "测试场景: $env:SCENARIO"'

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore src/TaoDown.App/TaoDown.App.csproj

      - name: 核心单元测试（含代码覆盖率采集）
        run: dotnet test src/TaoDown.Core.Tests/TaoDown.Core.Tests.csproj -c Release --nologo -v q --collect:"XPlat Code Coverage" --results-directory coverage

      - name: 云端出包（Release x64 框架依赖——安装包不内置 .NET 运行时）
        run: >
          dotnet publish src/TaoDown.App/TaoDown.App.csproj -c Release -r win-x64
          --self-contained false -p:Platform=x64

      - name: 定位发布目录
        shell: pwsh
        run: |
          $pub = Get-ChildItem -Directory -Recurse -Path src/TaoDown.App/bin/x64/Release |
                 Where-Object { $_.Name -eq 'publish' -and (Test-Path (Join-Path $_.FullName 'TaoDown.exe')) } |
                 Select-Object -First 1
          if (-not $pub) { throw "没找到含 TaoDown.exe 的 publish 目录" }
          "PUBLISH_DIR=$($pub.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 打包 MSI（离线 WiX 自动安装 + 构建后自检）
        shell: pwsh
        run: ./tools/msi/package.ps1 -PublishDir "$env:PUBLISH_DIR" -OutDir out

      - name: out 清单自检（应只有 1 个 msi）
        shell: pwsh
        run: |
          $msis = Get-ChildItem out -Filter *.msi
          if ($msis.Count -ne 1) { throw "out 里 msi 数量不对: $($msis.Count)" }
          Write-Host "MSI SHA256: $((Get-FileHash $msis[0].FullName -Algorithm SHA256).Hash)"

      - name: 【关1·像不像】 真实用户视角（静默安装→启动→稳定运行→截图）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Find-AppExe {
            $regKey = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -like "*TaoDown*" } | Select-Object -First 1
            if ($regKey -and $regKey.InstallLocation -and (Test-Path (Join-Path $regKey.InstallLocation "TaoDown.exe"))) {
              return (Join-Path $regKey.InstallLocation "TaoDown.exe")
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $cand = Join-Path $d "Program Files\TaoDown\TaoDown.exe"
              if (Test-Path $cand) { return $cand }
              $cand = Join-Path $d "Program Files (x86)\TaoDown\TaoDown.exe"
              if (Test-Path $cand) { return $cand }
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $pf = Join-Path $d "Program Files"
              if (Test-Path $pf) {
                $hit = Get-ChildItem $pf -Recurse -Depth 3 -Filter TaoDown.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            return $null
          }
          $msi = (Resolve-Path out/*.msi).Path
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v evidence\install.log" -LogPath evidence\install.log
          $appExe = Find-AppExe
          if (-not $appExe) { throw "安装后所有常规盘符都找不到 TaoDown.exe" }
          Write-Host "安装位置: $appExe"
          Start-Process $appExe
          Start-Sleep -Seconds 15
          if (-not (Get-Process TaoDown -ErrorAction SilentlyContinue)) { throw "启动后进程不在运行" }
          (New-Object -ComObject WScript.Shell).AppActivate('TaoDown') | Out-Null
          Snap "evidence\user-launch-1.png"
          Start-Sleep -Seconds 10
          if (-not (Get-Process TaoDown -ErrorAction SilentlyContinue)) { throw "10 秒后进程退出（稳定性不过）" }
          (New-Object -ComObject WScript.Shell).AppActivate('TaoDown') | Out-Null
          Snap "evidence\user-launch-2.png"
          Get-Process TaoDown -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host "真实用户视角：静默安装、启动、稳定运行均通过"

      - name: 【关1.5·新标准】 运行时两路断言（有运行时零下载）
        shell: pwsh
        run: |
          # 全系安装器新标准断言一: 云台 SDK 自带 .NET 桌面运行时, .NET 必须零下载直接用;
          # 界面框架与 VC++ 云台没有, 缺则联网装齐 (present 或 download-install ok 均算保障到位)
          $log = Join-Path $env:ProgramData 'TaoDown\taodown-runtime.log'
          if (-not (Test-Path $log)) { throw "运行时保障日志缺失: $log" }
          $lines = Get-Content $log
          if (-not ($lines | Where-Object { $_ -match 'runtime-present zero-download' })) { throw ".NET 未走零下载路: $($lines -join '; ')" }
          if (-not ($lines | Where-Object { $_ -match 'winappruntime-(present zero-download|download-install ok)' })) { throw "界面框架运行时未装齐: $($lines -join '; ')" }
          if (-not ($lines | Where-Object { $_ -match 'vcruntime-(present zero-download|download-install ok)' })) { throw "VC++ 运行库未装齐: $($lines -join '; ')" }
          Write-Host "运行时断言一通过：.NET 零下载直用，界面框架/VC++ 保障到位"

      - name: 【关2·功能】 真人模拟 24 用例云批（UIA 真界面驱动 + 真源 SHA 对账）
        if: env.SCENARIO != 'bigfile'
        shell: pwsh
        run: |
          pwsh -File e2e/human_sim.ps1

      - name: 【关3·好用】 自动挂载全链验证（登记核验+全内核真挂载）
        shell: pwsh
        run: ./tools/verify_mount.ps1

      - name: 【关3.5·接管】 六家浏览器下载接管实测（真触发下载, 非只验挂载）
        shell: pwsh
        run: ./tools/verify_takeover.ps1

      - name: 【关4·复杂】 超大文件+满列表并发回归（32GB 断点续传 + 40 任务并发 + 崩溃恢复）
        # always() 保留 v4 修红口径：同场时真人模拟红灯不连带跳过大文件闸，两闸各自暴露问题；
        # 短场（human）整段跳过，收口整场时恢复同场双闸
        if: always() && env.SCENARIO != 'human'
        shell: pwsh
        run: |
          pwsh -File e2e/bigfile_regression.ps1 -BigFileSizeGB 32 -ListCount 40

      - name: 【关5·暴力】 恶意攻击者视角（异常输入/路径穿越/崩溃监测）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Find-AppExe2 {
            $regKey = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -like "*TaoDown*" } | Select-Object -First 1
            if ($regKey -and $regKey.InstallLocation -and (Test-Path (Join-Path $regKey.InstallLocation "TaoDown.exe"))) {
              return (Join-Path $regKey.InstallLocation "TaoDown.exe")
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $cand = Join-Path $d "Program Files\TaoDown\TaoDown.exe"
              if (Test-Path $cand) { return $cand }
              $cand = Join-Path $d "Program Files (x86)\TaoDown\TaoDown.exe"
              if (Test-Path $cand) { return $cand }
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $pf = Join-Path $d "Program Files"
              if (Test-Path $pf) {
                $hit = Get-ChildItem $pf -Recurse -Depth 3 -Filter TaoDown.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            return $null
          }
          $appExe = Find-AppExe2
          if (-not $appExe) { throw "攻击视角找不到已安装的 TaoDown.exe" }
          Write-Host "攻击视角安装位置: $appExe"
          $werBefore = @(Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\WER" -Recurse -ErrorAction SilentlyContinue | Where-Object Name -like "*TaoDown*").Count
          Start-Process $appExe -ArgumentList "--attack=$('A'*4096)"
          Start-Sleep -Seconds 12
          (New-Object -ComObject WScript.Shell).AppActivate('TaoDown') | Out-Null
          Snap "evidence\attacker-longarg.png"
          Get-Process TaoDown -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Start-Process $appExe -ArgumentList "--config=..\..\..\..\Windows\System32\drivers\etc\hosts"
          Start-Sleep -Seconds 12
          (New-Object -ComObject WScript.Shell).AppActivate('TaoDown') | Out-Null
          Snap "evidence\attacker-traversal.png"
          Get-Process TaoDown -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $werAfter = @(Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Windows\WER" -Recurse -ErrorAction SilentlyContinue | Where-Object Name -like "*TaoDown*").Count
          Write-Host "TaoDown 相关 WER 崩溃记录: 前=$werBefore 后=$werAfter"
          if ($werAfter -gt $werBefore) { throw "出现新的 TaoDown 崩溃报告，攻击者视角不过" }
          Write-Host "恶意攻击者视角：异常输入与路径穿越未引发崩溃，通过"

      - name: 【关7·健壮】 异常注入组（断网恢复/满盘/monkey）+ 性能基线 + 录屏
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress 2>&1 | Out-Null
          pwsh -File e2e/robustness_injection.ps1 -MonkeyMinutes 3
      - name: 【对账】上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**
          if-no-files-found: ignore
          retention-days: 14
      - name: 【关6·稳定】 长稳浸泡 30 分钟（自动班：定时/整场手动触发）
        if: github.event_name != 'push' && env.SCENARIO == 'full'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Find-AppExeSoak {
            $regKey = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                      Where-Object { $_.DisplayName -like "*TaoDown*" } | Select-Object -First 1
            if ($regKey -and $regKey.InstallLocation -and (Test-Path (Join-Path $regKey.InstallLocation "TaoDown.exe"))) {
              return (Join-Path $regKey.InstallLocation "TaoDown.exe")
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $cand = Join-Path $d "Program Files\TaoDown\TaoDown.exe"
              if (Test-Path $cand) { return $cand }
            }
            foreach ($d in (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }).Root) {
              $pf = Join-Path $d "Program Files"
              if (Test-Path $pf) {
                $hit = Get-ChildItem $pf -Recurse -Depth 3 -Filter TaoDown.exe -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($hit) { return $hit.FullName }
              }
            }
            return $null
          }
          $appExe = Find-AppExeSoak
          if (-not $appExe) { throw "浸泡前找不到已安装的 TaoDown.exe" }
          Write-Host "浸泡目标: $appExe"
          Start-Process $appExe
          Start-Sleep -Seconds 15
          if (-not (Get-Process TaoDown -ErrorAction SilentlyContinue)) { throw "浸泡启动失败，进程不在" }
          $minutes = 0
          while ($minutes -lt 30) {
            Start-Sleep -Seconds 60
            $minutes++
            if (-not (Get-Process TaoDown -ErrorAction SilentlyContinue)) { throw "浸泡第 $minutes 分钟进程退出，长稳不过" }
            if ($minutes % 10 -eq 0) {
              Snap "evidence\soak-$minutes.png"
              $sz = (Get-Item "evidence\soak-$minutes.png").Length
              if ($sz -lt 20000) { throw "第 $minutes 分钟截图疑似空白（$sz 字节），视觉回归不过" }
              Write-Host "浸泡 ${minutes}/30 分钟存活，截图 ${sz} 字节"
            }
          }
          Get-Process TaoDown -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "长稳浸泡 30 分钟通过，三张留证截图非空白"

      - name: 【关6·稳定】 下载高峰界面响应回归（v2.55 看门狗闸）
        shell: pwsh
        run: |
          # 复现真机卡死场景：大文件下载进行中，界面必须保持响应（单拍刷新不超 1.5 秒）
          $big = "$env:TEMP\big.bin"
          if (-not (Test-Path $big) -or ((Get-Item $big).Length -lt 300MB)) {
            $fs = [System.IO.File]::Create($big); $fs.SetLength(400MB); $fs.Close()
          }
          $srv = [System.Net.HttpListener]::new()
          $srv.Prefixes.Add('http://127.0.0.1:18099/')
          $srv.Start()
          # 修红（run 43728875969 归因）：Start-Job 跨进程传 HttpListener 活对象是死壳，源不回数据；
          # 改同进程 Runspace，活对象直传（human_sim/bigfile 两脚本 v2 同口径）
          $srcRs = [runspacefactory]::CreateRunspace()
          $srcRs.Open()
          $srcPs = [powershell]::Create()
          $srcPs.Runspace = $srcRs
          [void]$srcPs.AddScript({
            param($s)
            while ($s.IsListening) {
              $ctx = $s.GetContext()
              $ctx.Response.ContentType = 'application/octet-stream'
              $ctx.Response.ContentLength64 = 400MB
              $buf = New-Object byte[] (1MB)
              for ($i = 0; $i -lt 400; $i++) { $ctx.Response.OutputStream.Write($buf, 0, $buf.Length) }
              $ctx.Response.OutputStream.Close()
            }
          }).AddArgument($srv)
          $srcHandle = $srcPs.BeginInvoke()
          Start-Process "D:\Program Files\TaoDown\TaoDown.exe" -ArgumentList '"http://127.0.0.1:18099/big.bin"'
          Start-Sleep -Seconds 150
          $log = Get-ChildItem "D:\TaoDownData\TaoDown\logs\startup.log","$env:USERPROFILE\TaoDownData\TaoDown\logs\startup.log" -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($log) {
            $slow = Select-String -Path $log.FullName -Pattern '界面心跳连续卡顿' | Select-Object -Last 1
            if ($slow) { throw "下载高峰界面响应不达标：$($slow.Line)" }
          }
          Get-Process TaoDown -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          # 修红（run 43739133787 归因）：Runspace 线程堵在 GetContext 等下一请求，直接 Stop 互相等死锁——
          # 必须先关监听让 GetContext 解除阻塞，线程退出后清理才回得来
          $srv.Stop(); Start-Sleep -Seconds 2
          try { $srcPs.Stop(); $srcRs.Close() } catch { }
          Write-Host '下载高峰 150 秒界面响应达标（看门狗零命中）'

      - name: 【L8·升级回滚】 升级与回滚路径（覆盖安装→静默卸载→重装验证）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Snap($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $msi = (Resolve-Path out/*.msi).Path
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\cover.log" -LogPath out\cover.log
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/x `"$msi`" /qn /norestart /l*v out\uninstall.log" -LogPath out\uninstall.log
          Start-Sleep -Seconds 3
          $gone = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                  Where-Object { $_.DisplayName -like "*TaoDown*" }
          if ($gone) { throw "卸载后注册表仍有残留条目" }
          Write-Host "卸载校验：注册表无残留"
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" /qn /norestart /l*v out\reinstall.log" -LogPath out\reinstall.log
          Start-Sleep -Seconds 5
          (New-Object -ComObject WScript.Shell).AppActivate('TaoDown') | Out-Null
          Snap "evidence\l8-reinstall.png"
          Write-Host "升级与回滚路径：覆盖安装、静默卸载、重装均通过"

          # ---- 全系安装器新标准断言二: 强制三项全走下载路, 官方运行时装齐后以实测为准 ----
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/x `"$msi`" /qn /norestart /l*v out\uninstall2.log" -LogPath out\uninstall2.log
          Remove-Item (Join-Path $env:ProgramData 'TaoDown\taodown-runtime.log') -Force -ErrorAction SilentlyContinue
          ./tools/msi/invoke-msi.ps1 -MsiArgs "/i `"$msi`" TAODOWNFORCE=1 /qn /norestart /l*v out\forced-runtime.log" -LogPath out\forced-runtime.log
          $log = Join-Path $env:ProgramData 'TaoDown\taodown-runtime.log'
          if (-not (Test-Path $log)) { throw "运行时保障日志缺失: $log" }
          $lines = Get-Content $log
          if (-not ($lines | Where-Object { $_ -match 'runtime-download-install ok' })) { throw ".NET 强制下载路未装齐: $($lines -join '; ')" }
          if (-not ($lines | Where-Object { $_ -match 'winappruntime-download-install ok' })) { throw "界面框架强制下载路未装齐: $($lines -join '; ')" }
          if (-not ($lines | Where-Object { $_ -match 'vcruntime-download-install ok' })) { throw "VC++ 强制下载路未装齐: $($lines -join '; ')" }
          Write-Host "运行时断言二通过：TAODOWNFORCE=1 三项运行时官方渠道下载装齐"

      - name: 【关8·对账】 上传测试证据与安装包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiview-evidence
          path: |
            evidence/**
            out/*.msi
          retention-days: 14
